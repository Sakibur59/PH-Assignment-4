<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Job Application Tracker</title>
    <style>
        *{
            font-family: "Geist", sans-serif;
        }
    </style>
  </head>
  <body class="bg-[#F8FAFC]">
    <header class="max-w-[1120px] mx-auto">
        <h1 class="mt-9 text-4xl font-bold text-[#002C5C]">Job Application Tracker</h1>
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mt-5">
            <div class="bg-[#FFFFFF] rounded-md p-5">
                <p class="text-[#323B49]">Total</p>
                <p class="text-[#002C5C] font-bold text-[24px]">8</p>
            </div>
            <div class="bg-[#FFFFFF] rounded-md p-5">
                <p class="text-[#323B49]">Interview</p>
                <p class="text-[24px] text-[#10B981] font-bold">0</p>
            </div>
            <div class="bg-[#FFFFFF] rounded-md p-5">
                <p class="text-[#323B49]">Rejected</p>
                <p class="text-[24px] text-[#EF4444] font-bold">0</p>
            </div>
        </div>
        <hr class="mt-10 text-[#E6E7E9]">
    </header>
  </body>
</html>
