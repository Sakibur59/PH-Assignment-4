<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Job Application Tracker</title>
    <style>
      * {
        font-family: "Geist", sans-serif;
      }
    </style>
  </head>
  <body class="bg-[#F8FAFC] max-w-[1120px] mx-auto">
    <header class="">
      <h1 class="mt-9 text-4xl font-bold text-[#002C5C]">
        Job Application Tracker
      </h1>
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mt-5">
        <div class="bg-[#FFFFFF] rounded-md p-5">
          <p class="text-[#323B49]">Total</p>
          <p class="text-[#002C5C] font-bold text-[24px]">8</p>
        </div>
        <div class="bg-[#FFFFFF] rounded-md p-5">
          <p class="text-[#323B49]">Interview</p>
          <p class="text-[24px] text-[#10B981] font-bold">0</p>
        </div>
        <div class="bg-[#FFFFFF] rounded-md p-5">
          <p class="text-[#323B49]">Rejected</p>
          <p class="text-[24px] text-[#EF4444] font-bold">0</p>
        </div>
      </div>
      <hr class="mt-10 text-[#E6E7E9]" />
    </header>

    <main>
      <div class="flex justify-between items-center mt-10">
        <div>
          <p class="text-[#002C5C]  font-bold text-2xl">Available Jobs</p>
        </div>
        <div>
          <span class="text-[#64748B] font-medium text-[1rem]">8</span>
          <span class="text-[#64748B] font-medium text-[1rem]">jobs</span>
        </div>
      </div>
      <div class="mt-5">
        <button class="px-8 py-2 bg-[#3B82F6] font-semibold   border-1 rounded-md text-white mr-4">All</button>
        <button class="px-5 py-2  font-medium border-gray-300 text-[#64748B] border-1 rounded-md bg-white mr-4">Interview</button>
        <button class="px-5 py-2  font-medium border-gray-300 text-[#64748B] border-1 rounded-md bg-white">Rejected</button>
      </div>
    </main>
  </body>
</html>
